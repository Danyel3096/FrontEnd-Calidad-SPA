<div class="d-flex flex-row flex-shrink-0 row">
    <div class="col-3 flex-column sidebar-fixed">
      
    </div>
    <div class="col-9 flex-column flex-grow-1 p-3">
      <div class="row">
        <div class="col-12">
          <h1 class="text-center">Gestión de Productos</h1>
        </div>
      </div>
      
      <div class="row justify-content-center">
        <div class="col-12">
          <table id="productsTable" class="display table table-striped table-bordered w-100 custom-table">
            <thead>
              <tr>
                <!-- <th>ID</th> -->
                <th>Nombre</th>
                <th>Foto</th>
                <!-- <th>Descripción</th> -->
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let product of products">
                <td>{{ product.id }}</td>
                <td>
                  <img [src]="product.image" alt="Foto del producto" class="img-thumbnail" width="50">
                </td>
                <td>{{ product.title }}</td>
                <td>{{ product.price | currency }}</td>
                <td>{{ product.category }}</td>
                <!--<td>{{ product.stock_producto }}</td>-->
                <!--<td>
                  <span [class.text-success]="product.estado" [class.text-danger]="!product.estado">
                    {{ product.estado ? 'Disponible' : 'Agotado' }}
                  </span>
                </td>-->
                <td class="text-center">
                  <button class="btn btn-info btn-sm mx-1" (click)="seeProduct(product)">
                    <i class="fas fa-eye"></i>
                  </button>
                  <button class="btn btn-warning btn-sm mx-1" (click)="editProduct(product)">
                    <i class="fas fa-edit"></i>
                  </button><!--
                  <button 
                    class="btn btn-sm mx-1" 
                    [ngClass]="product.estado ? 'btn-danger' : 'btn-success'" 
                    (click)="toggleProductStatus(product)">
                    <i [ngClass]="product.estado ? 'fas fa-ban' : 'fas fa-check'"></i>
                  </button>-->
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Modal para Ver/Editar Producto -->
  <div id="productModal" class="modal fade" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            {{ modalMode === 'view' ? 'Ver Producto' : 'Editar Producto' }}
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form #productForm="ngForm">
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input *ngIf="selectedProduct" type="text" class="form-control" [(ngModel)]="selectedProduct.title" name="nombre_producto" [disabled]="modalMode === 'view'">
            </div>
            <div class="mb-3">
              <label class="form-label">Descripción</label>
              <textarea *ngIf="selectedProduct" class="form-control" [(ngModel)]="selectedProduct.description" name="descripcion" [disabled]="modalMode === 'view'"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Foto</label>
              <input type="file" class="form-control" (change)="handleImageUpload($event)" *ngIf="modalMode === 'edit'">
              <img *ngIf="selectedProduct?.image" [src]="selectedProduct.image" class="img-thumbnail mt-2" width="100">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button *ngIf="modalMode === 'edit'" type="button" class="btn btn-primary" (click)="saveProductChanges()">Guardar Cambios</button>
        </div>
      </div>
    </div>
  </div>
