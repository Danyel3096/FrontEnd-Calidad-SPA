<div  class="max-w-sm bg-gray-800 border border-gray-200 rounded-lg shadow dark:bg-white dark:border-gray-700">
  <a [routerLink]="['/product', product().id]">
    <picture>
      <img
        class="rounded-t-lg h-60 w-full object-contain object-center pt-5 cursor-pointer"
        [src]="product().image"
        alt="{{ product().title }}"
      />
    </picture>
  </a>

  <div class="p-5">
    <h5 class="mb-2 text-xl font-bold tracking-tight text-gray-900 dark:text-black line-clamp-1">
      <a
        [routerLink]="['/product', product().id]"
        class="text-gray-900 hover:underline dark:text-black"
      >
        {{ product().title }}
      </a>
    </h5>

    <!-- 🔥 Categoría del producto -->
    <p class="mb-2 text-sm text-gray-700 dark:text-gray-800">
      <strong>Categoría:</strong> {{ product().category }}
    </p>

    <p class="mb-3 font-normal line-clamp-3">
      {{ product().description }}
    </p>

    <div class="flex justify-center my-4">
      <button
        class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-center text-white bg-green-700 rounded-lg hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-blue-800"
        (click)="add($event)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-shopping-cart"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M6 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
          <path d="M17 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
          <path d="M17 17h-11v-14h-2" />
          <path d="M6 5l14 1l-1 7h-13" />
        </svg>
        Agregar al carrito
      </button>
    </div>
  </div>
</div>
